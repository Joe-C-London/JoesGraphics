import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

buildscript {
    ext.kotlin_version = '2.4.21'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
plugins {
    id "com.github.ben-manes.versions" version "0.65.0"
    id "com.diffplug.spotless" version "8.10.4"
    id "jacoco"
}
ext {
    junit_version = "6.1.3"
    junit_platform_version = "6.1.3"
    awaitility_version = "4.3.0"
    jts_version = "1.20.0"
}

apply plugin: 'kotlin'

group 'com.joecollins'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        maven {
            url "https://repo.osgeo.org/repository/release/"
        }
        mavenCentral()
    }

    apply plugin: "com.diffplug.spotless"

    tasks.withType(KotlinCompile).configureEach {
        kotlinOptions.allWarningsAsErrors = true
    }

    plugins.withId('org.jetbrains.kotlin.jvm') {
        kotlin {
            jvmToolchain(25)
        }
    }

    spotless {
        kotlin {
            ktlint()
                .editorConfigOverride([
                    "max_line_length" : 2147483647,
                    "ij_kotlin_line_break_after_multiline_when_entry": "false",
                ])
        }
    }
}

dependencies {
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}

jacoco {
    toolVersion = "0.8.15"
    reportsDirectory = file("$buildDir/jacocoReports")
}

jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = file("${buildDir}/jacocoReports")
    }
}